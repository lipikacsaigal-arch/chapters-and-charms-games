<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chapters & Charms: Hidden Library</title>
    <style>
        :root { --vintage-brown: #4a3728; --paper-color: #f4ece1; --accent-gold: #c5a059; }
        body { font-family: 'Georgia', serif; background-color: var(--vintage-brown); color: var(--paper-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; touch-action: manipulation; }
        #setup-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; padding: 20px; }
        input { padding: 12px; font-size: 1.2rem; border-radius: 8px; border: none; margin-bottom: 15px; width: 80%; max-width: 300px; }
        button { padding: 12px 30px; font-size: 1.2rem; background: var(--accent-gold); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #game-header { width: 100%; background: rgba(0,0,0,0.7); padding: 10px 0; display: none; justify-content: space-around; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--accent-gold); }
        #game-container { display: none; position: relative; width: 100%; max-width: 600px; margin: 10px auto; }
        #library-img { width: 100%; display: block; border: 2px solid var(--accent-gold); pointer-events: none; }
        .item-target { position: absolute; background: rgba(255, 255, 255, 0); border-radius: 50%; cursor: pointer; z-index: 10; -webkit-tap-highlight-color: transparent; }
        #checklist { display: none; background: var(--paper-color); color: #333; width: 90%; max-width: 600px; margin: 15px auto; padding: 15px; border-radius: 10px; column-count: 2; list-style: none; }
        .checklist-item { font-size: 0.85rem; margin-bottom: 5px; }
        .found { text-decoration: line-through; color: #888; opacity: 0.6; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; text-align: center; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1 style="color:var(--accent-gold)">Chapters & Charms</h1>
        <p>Can you find 10 hidden objects in 60 seconds?</p>
        <input type="text" id="guestName" placeholder="Enter Guest Name..." required>
        <button onclick="startGame()">START GAME</button>
    </div>

    <div id="game-header">
        <div>Guest: <b id="display-name" style="color:var(--accent-gold)"></b></div>
        <div>Time: <b id="timer">60</b>s</div>
        <div>Found: <b id="counter">0</b>/10</div>
    </div>

    <div id="game-container">
        <img src="library.jpg" id="library-img">
        <!-- HITBOXES -->
        <div class="item-target" onclick="find(0, this)" style="left: 3%; top: 25%; width: 9%; height: 8%;"></div>
        <div class="item-target" onclick="find(1, this)" style="left: 23%; top: 33%; width: 7%; height: 6%;"></div>
        <div class="item-target" onclick="find(2, this)" style="left: 60%; top: 60%; width: 7%; height: 6%;"></div>
        <div class="item-target" onclick="find(3, this)" style="left: 40%; top: 57%; width: 12%; height: 10%;"></div>
        <div class="item-target" onclick="find(4, this)" style="left: 30%; top: 86%; width: 10%; height: 7%;"></div>
        <div class="item-target" onclick="find(5, this)" style="left: 25%; top: 78%; width: 10%; height: 7%;"></div>
        <div class="item-target" onclick="find(6, this)" style="left: 83%; top: 70%; width: 7%; height: 6%;"></div>
        <div class="item-target" onclick="find(7, this)" style="left: 82%; top: 76%; width: 7%; height: 6%;"></div>
        <div class="item-target" onclick="find(8, this)" style="left: 12%; top: 22%; width: 5%; height: 5%;"></div>
        <div class="item-target" onclick="find(9, this)" style="left: 26%; top: 63%; width: 5%; height: 7%;"></div>
    </div>

    <ul id="checklist">
        <li class="checklist-item" id="item-0">⚪ Silver Heart</li>
        <li class="checklist-item" id="item-1">⚪ Gold Star</li>
        <li class="checklist-item" id="item-2">⚪ Blue Butterfly</li>
        <li class="checklist-item" id="item-3">⚪ Sleeping Cat</li>
        <li class="checklist-item" id="item-4">⚪ Magnifying Glass</li>
        <li class="checklist-item" id="item-5">⚪ White Envelope</li>
        <li class="checklist-item" id="item-6">⚪ Teapot Butterfly</li>
        <li class="checklist-item" id="item-7">⚪ Saucer Butterfly</li>
        <li class="checklist-item" id="item-8">⚪ Wall Star</li>
        <li class="checklist-item" id="item-9">⚪ Tiny Candle</li>
    </ul>

    <div id="overlay">
        <h2 id="result-title" style="color:var(--accent-gold); font-size: 2rem;"></h2>
        <p id="result-msg" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
        <button onclick="location.reload()">TRY AGAIN</button>
    </div>

    <script>
        let foundCount = 0;
        let timeLeft = 60;
        let timerId;

        function startGame() {
            const name = document.getElementById('guestName').value;
            if(!name) { alert("Please enter your name, guest!"); return; }
            document.getElementById('display-name').innerText = name;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-header').style.display = 'flex';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('checklist').style.display = 'block';
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if(timeLeft <= 0) endGame(false);
            }, 1000);
        }

        function find(index, el) {
            const item = document.getElementById('item-' + index);
            if(item.classList.contains('found')) return;
            item.classList.add('found');
            item.innerText = item.innerText.replace('⚪', '✅');
            el.style.background = "rgba(197, 160, 89, 0.5)";
            el.style.border = "2px solid gold";
            foundCount++;
            document.getElementById('counter').innerText = foundCount;
            if(foundCount === 10) endGame(true);
        }

        function endGame(win) {
            clearInterval(timerId);
            document.getElementById('overlay').style.display = 'flex';
            if(win) {
                document.getElementById('result-title').innerText = "VICTORY!";
                document.getElementById('result-msg').innerText = "You found all 10 items with " + timeLeft + "s left!";
            } else {
                document.getElementById('result-title').innerText = "TIME'S UP!";
                document.getElementById('result-msg').innerText = "You found " + foundCount + " objects. The library remains a mystery!";
            }
        }
    </script>
</body>
</html>
