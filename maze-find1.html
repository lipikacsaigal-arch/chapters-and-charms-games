<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Chapter & Charm: The Literary Path</title>
    <style>
        :root { --wood: #4a3728; --gold: #c5a059; --paper: #fdfaf3; --accent: #8b5e3c; --ink: #1a2a3a; }
        
        body { 
            font-family: 'Georgia', serif; 
            background: #2c1e14; 
            color: var(--wood); 
            margin: 0; 
            text-align: center;
        }

        /* --- START SCREEN --- */
        #start-screen { 
            height: 100vh; 
            width: 100%;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            background: linear-gradient(rgba(44, 30, 20, 0.75), rgba(44, 30, 20, 0.75)), url('maze_bg.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .deco { position: absolute; pointer-events: none; z-index: 5; }
        .deco-botanical-l { top: -10px; left: -10px; width: 180px; }
        .deco-botanical-r { top: -10px; right: -10px; width: 180px; }
        .deco-crate { bottom: 10px; left: 10px; width: 150px; }
        .deco-book { bottom: 10px; right: 10px; width: 150px; }

        .parchment-box { 
            background: var(--paper); 
            padding: 30px 20px; 
            border-radius: 8px; 
            border: 2px solid var(--gold);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            width: 85%; 
            max-width: 380px; 
            z-index: 20;
        }

        .heart-divider { width: 180px; margin: 10px auto; display: block; }
        h1 { font-size: 1.6rem; margin: 0; color: var(--accent); text-transform: uppercase; }

        input { 
            padding: 12px; 
            font-size: 1rem; 
            border: 1px solid var(--gold); 
            border-radius: 4px; 
            width: 80%; 
            margin-bottom: 20px; 
            text-align: center;
        }

        .btn-start { 
            background: var(--accent); 
            color: #fff; 
            border: none; 
            padding: 14px 40px; 
            font-size: 1.1rem; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 4px 0 #5d3f29;
        }

        /* --- GAME UI --- */
        #game-ui { display: none; background: #1a110a; color: var(--paper); padding: 10px; position: sticky; top: 0; z-index: 100; justify-content: space-around; border-bottom: 2px solid var(--gold); }
        .stat b { display: block; color: var(--gold); font-size: 1.1rem; }

        /* --- MAZE AREA --- */
        #game-area { 
            display: none; 
            position: relative; 
            width: 100%; 
            max-width: 600px; 
            margin: 10px auto; 
            overflow: visible;
        }
        
        #bg-img { width: 100%; display: block; border: 2px solid var(--gold); pointer-events: none; }
        
        #maze-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: crosshair;
            touch-action: none; /* Drawing only */
        }

        /* --- CONTROLS --- */
        .controls { 
            display: none; 
            background: var(--paper); 
            padding: 10px; 
            margin: 5px; 
            border-radius: 8px; 
            border: 1px solid var(--gold);
        }
        .control-group { display: inline-block; margin: 0 10px; }
        .btn-tool { background: var(--wood); color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        .btn-tool:disabled { opacity: 0.3; }

        #popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; flex-direction: column; justify-content: center; align-items: center; padding: 20px; color: #fff; }
    </style>
</head>
<body>

    <div id="start-screen">
        <img src="botanical_left.png" class="deco deco-botanical-l">
        <img src="botanical_right.png" class="deco deco-botanical-r">
        <img src="wooden_crate.png" class="deco deco-crate">
        <img src="book_flower.png" class="deco deco-book">

        <div class="parchment-box">
            <h1>The Pathfinder</h1>
            <img src="divider.png" class="heart-divider">
            <p>1m 30s to reach the end!</p>
            <input type="text" id="guestName" placeholder="Enter Guest Name...">
            <br>
            <button class="btn-start" onclick="beginGame()">FIND THE WAY</button>
        </div>
    </div>

    <div id="game-ui">
        <div class="stat">GUEST<br><b id="name-tag">---</b></div>
        <div class="stat">TIMER<br><b id="timer">90</b>s</div>
        <div class="stat">PEN SIZE<br><b id="pen-display">2</b></div>
    </div>

    <div id="game-area">
        <img src="maze_bg.jpg" id="bg-img">
        <canvas id="maze-canvas"></canvas>
    </div>

    <div class="controls" id="game-controls">
        <div class="control-group">
            Pen: 
            <button class="btn-tool" onclick="changeSize(-1)">−</button>
            <button class="btn-tool" onclick="changeSize(1)">+</button>
        </div>
        <div class="control-group">
            <button class="btn-tool" style="background:#666" onclick="clearInk()">Erase</button>
        </div>
    </div>

    <div id="popup">
        <h1 id="pop-h" style="color:var(--gold); font-size: 2.5rem;"></h1>
        <p id="pop-p" style="font-size: 1.1rem;"></p>
        <button class="btn-start" onclick="location.reload()">TRY AGAIN</button>
    </div>

    <script>
        let time = 90, active = false, clock;
        let penSize = 2;
        const canvas = document.getElementById('maze-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function beginGame() {
            const name = document.getElementById('guestName').value.trim();
            if(!name) return alert("Enter name!");

            document.getElementById('name-tag').innerText = name;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('game-controls').style.display = 'block';
            
            initCanvas();
            active = true;
            clock = setInterval(() => {
                time--;
                document.getElementById('timer').innerText = time;
                if(time <= 0) finish(false);
            }, 1000);
        }

        function initCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            updatePenStyle();
        }

        function updatePenStyle() {
            ctx.strokeStyle = "#1a2a3a"; 
            ctx.lineWidth = penSize;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            document.getElementById('pen-display').innerText = penSize;
        }

        function changeSize(amt) {
            penSize = Math.max(1, Math.min(10, penSize + amt));
            updatePenStyle();
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            // Scaling coordinates to canvas internal resolution
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY,
                pctX: (clientX - rect.left) / rect.width,
                pctY: (clientY - rect.top) / rect.height
            };
        }

        function start(e) {
            if(!active || (e.touches && e.touches.length > 1)) return; // Allow pinch zoom
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function move(e) {
            if(!isDrawing || !active || (e.touches && e.touches.length > 1)) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            // Victory Check (Finish area bottom right)
            if(pos.pctX > 0.82 && pos.pctY > 0.85) finish(true);
        }

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', move);
        window.addEventListener('mouseup', () => isDrawing = false);

        canvas.addEventListener('touchstart', start, {passive: false});
        canvas.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('touchend', () => isDrawing = false);

        function clearInk() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function finish(win) {
            active = false;
            clearInterval(clock);
            document.getElementById('popup').style.display = 'flex';
            document.getElementById('pop-h').innerText = win ? "SUCCESS!" : "LOST!";
            document.getElementById('pop-p').innerText = win ? "You reached the end!" : "Time ran out!";
        }

        window.addEventListener('resize', initCanvas);
    </script>
</body>
</html>
