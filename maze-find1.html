<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chapter & Charm: The Pathfinder</title>
    <style>
        :root { --wood: #4a3728; --gold: #c5a059; --paper: #fdfaf3; --accent: #8b5e3c; --ink: #1a2a3a; }
        
        body { 
            font-family: 'Georgia', serif; 
            background: #2c1e14; 
            color: var(--wood); 
            margin: 0; 
            text-align: center; 
            overflow: hidden; /* Prevent scrolling during the game */
            touch-action: none;
        }

        /* --- START SCREEN --- */
        #start-screen { 
            height: 100vh; 
            width: 100%;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            background: linear-gradient(rgba(44, 30, 20, 0.75), rgba(44, 30, 20, 0.75)), url('maze_bg.jpg');
            background-size: cover;
            position: relative;
        }

        .deco { position: absolute; pointer-events: none; z-index: 5; }
        .deco-botanical-l { top: -10px; left: -10px; width: 220px; }
        .deco-botanical-r { top: -10px; right: -10px; width: 220px; }
        .deco-crate { bottom: 10px; left: 10px; width: 180px; }
        .deco-book { bottom: 10px; right: 10px; width: 180px; }

        .parchment-box { 
            background: var(--paper); 
            padding: 40px 25px; 
            border-radius: 8px; 
            border: 2px solid var(--gold);
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
            width: 85%; 
            max-width: 400px; 
            z-index: 20;
        }

        .heart-divider { width: 200px; margin: 15px auto; display: block; }
        h1 { font-size: 1.8rem; margin: 0; color: var(--accent); text-transform: uppercase; }

        input { 
            padding: 12px; 
            font-size: 1rem; 
            border: 2px solid var(--gold); 
            border-radius: 4px; 
            width: 80%; 
            margin-bottom: 15px; 
            text-align: center;
        }

        .btn-start { 
            background: var(--accent); 
            color: #fff; 
            border: none; 
            padding: 14px 40px; 
            font-size: 1.1rem; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
        }

        /* --- GAME UI --- */
        #game-ui { display: none; background: #1a110a; color: var(--paper); padding: 12px; position: sticky; top: 0; z-index: 100; justify-content: space-around; border-bottom: 2px solid var(--gold); }
        .stat b { display: block; color: var(--gold); font-size: 1.2rem; }

        /* --- MAZE AREA --- */
        #game-area { 
            display: none; 
            position: relative; 
            width: 100%; 
            max-width: 600px; 
            margin: 10px auto; 
        }
        
        #bg-img { width: 100%; display: block; border: 3px solid var(--gold); pointer-events: none; }
        
        #maze-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: crosshair;
        }

        .controls { margin-top: 10px; display: none; }
        .btn-clear { background: #666; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }

        #popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 200; flex-direction: column; justify-content: center; align-items: center; padding: 20px; color: #fff; }
    </style>
</head>
<body>

    <!-- SCREEN 1 -->
    <div id="start-screen">
        <img src="botanical_left.png" class="deco deco-botanical-l">
        <img src="botanical_right.png" class="deco deco-botanical-r">
        <img src="wooden_crate.png" class="deco deco-crate">
        <img src="book_flower.png" class="deco deco-book">

        <div class="parchment-box">
            <h1>Literary Path</h1>
            <img src="divider.png" class="heart-divider">
            <p>Draw the path from <b>START</b> to <b>FINISH</b>!</p>
            <input type="text" id="guestName" placeholder="Enter Guest Name...">
            <br>
            <button class="btn-start" onclick="beginGame()">FIND THE WAY</button>
        </div>
    </div>

    <!-- GAME TOP HEADER -->
    <div id="game-ui">
        <div class="stat">GUEST<br><b id="name-tag">---</b></div>
        <div class="stat">TIMER<br><b id="timer">60</b>s</div>
        <div class="stat" id="goal-text">Goal:<br><b style="color:white">Reach Finish!</b></div>
    </div>

    <!-- GAME AREA -->
    <div id="game-area">
        <img src="maze_bg.jpg" id="bg-img">
        <canvas id="maze-canvas"></canvas>
    </div>

    <div class="controls" id="draw-controls">
        <button class="btn-clear" onclick="clearInk()">Erase Path</button>
    </div>

    <div id="popup">
        <h1 id="pop-h" style="color:var(--gold); font-size: 3rem;"></h1>
        <p id="pop-p" style="font-size: 1.2rem;"></p>
        <button class="btn-start" onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script>
        let time = 60, active = false, clock;
        const canvas = document.getElementById('maze-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function beginGame() {
            const name = document.getElementById('guestName').value.trim();
            if(!name) return alert("Please enter your name!");

            document.getElementById('name-tag').innerText = name;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('draw-controls').style.display = 'block';
            
            setupCanvas();
            active = true;
            clock = setInterval(() => {
                time--;
                document.getElementById('timer').innerText = time;
                if(time <= 0) finish(false);
            }, 1000);
        }

        function setupCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.strokeStyle = "#1a2a3a"; // Ink blue
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top,
                pctX: (clientX - rect.left) / rect.width,
                pctY: (clientY - rect.top) / rect.height
            };
        }

        function startDrawing(e) {
            if(!active) return;
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if(!isDrawing || !active) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            // CHECK IF REACHED FINISH (Bottom Right Area)
            // If the pen is roughly in the bottom 15% right 20% of the image
            if(pos.pctX > 0.80 && pos.pctY > 0.85) {
                finish(true);
            }
        }

        function stopDrawing() { isDrawing = false; }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        function clearInk() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function finish(win) {
            active = false;
            isDrawing = false;
            clearInterval(clock);
            document.getElementById('popup').style.display = 'flex';
            if(win) {
                document.getElementById('pop-h').innerText = "SUCCESS!";
                document.getElementById('pop-p').innerText = "You found the happy ending in " + (60-time) + " seconds!";
            } else {
                document.getElementById('pop-h').innerText = "LOST IN PAGES";
                document.getElementById('pop-p').innerText = "Time ran out before you reached the tea!";
            }
        }

        window.addEventListener('resize', setupCanvas);
    </script>
</body>
</html>
